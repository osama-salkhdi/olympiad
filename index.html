<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#214539">
<title>مكتب الأولمبياد العلمي السوري بدرعا — منصات التدريب</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.3.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.3.0/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rakkas@5.2.5/400.css">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#f7eee7;color:#214539;font:500 17px/1.8 Tajawal,Tahoma,sans-serif;display:flex;flex-direction:column}
header{background:#214539;border-bottom:6px solid #ba925f;text-align:center;padding:26px 16px 22px}
header img{height:84px;background:#fff9f3;border-radius:20px;padding:8px}
h1{margin:8px 0 0;font:400 clamp(26px,6vw,40px)/1.4 Rakkas,Tajawal,serif;color:#f4e3bf}
header p{margin:2px 0 0;color:#d9bc8c;font-size:15px}
main{flex:1;width:100%;max-width:940px;margin:0 auto;padding:22px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
a.c{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;color:#214539;background:#fff9f3;border:1px solid #e6d6c4;border-radius:20px;padding:30px 12px 22px;transition:.18s;box-shadow:0 2px 10px rgba(60,45,20,.06)}
a.c::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--k)}
a.c:hover,a.c:focus-visible{transform:translateY(-5px);border-color:var(--k);box-shadow:0 12px 26px rgba(60,45,20,.14);outline:none}
.i{width:78px;height:78px;border-radius:22px;background:var(--k);color:#fff;display:grid;place-items:center;transition:.18s}
a.c:hover .i{transform:rotate(-6deg)}
.i svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
a.c b{font:400 30px/1.4 Rakkas,Tajawal,serif}
a.c small{color:#7c8b82;font-size:13.5px}
a.c.off{opacity:.5;pointer-events:none}
footer{text-align:center;color:#7c8b82;font-size:14px;padding:12px 0 26px}footer b{color:#a0763f}
nav.t{display:flex;gap:8px;justify-content:center;margin:0 0 18px;flex-wrap:wrap}
nav.t button{font:inherit;font-weight:800;font-size:15px;border:1.5px solid #214539;background:#fff9f3;color:#214539;border-radius:12px;padding:6px 20px;cursor:pointer}
nav.t button.on{background:#214539;color:#f7eee7}
.panel{background:#fff9f3;border:1px solid #e6d6c4;border-top:6px solid #214539;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(60,45,20,.06)}
.lock{max-width:430px;margin:10px auto;text-align:center}.lock h2,.vh h2{font:400 28px/1.4 Rakkas,Tajawal,serif;margin:0 0 6px}
.lock form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
input,textarea{font:inherit;padding:8px 11px;border:1px solid #e6d6c4;border-radius:10px;background:#fff;color:#214539;width:100%}
input.l,textarea.l{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:15px}
.btn{font:inherit;font-weight:800;font-size:14.5px;border:1.5px solid #214539;background:#214539;color:#f7eee7;border-radius:12px;padding:7px 18px;cursor:pointer}
.btn.s{background:#fff9f3;color:#214539}.btn.g{background:#ba925f;border-color:#ba925f;color:#214539}.btn.bad{background:#fff9f3;color:#b0412e;border-color:#b0412e}.btn.x{padding:3px 10px;font-size:13px}
.err{color:#b0412e;font-weight:700;min-height:24px}.mut{color:#7c8b82;font-size:14px}
.note{background:#efe2d4;border-inline-start:4px solid #ba925f;border-radius:8px;padding:7px 12px;margin:10px 0;font-size:14.5px;text-align:right}.note.w{border-color:#b0412e;background:#f6e3dc}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.tools{display:flex;gap:8px;flex-wrap:wrap}
details.sp{border:1px solid #e6d6c4;border-radius:14px;margin:10px 0;background:#f7eee7;overflow:hidden}
details.sp>summary{cursor:pointer;padding:9px 14px;font:400 23px/1.5 Rakkas,Tajawal,serif;display:flex;align-items:center;gap:10px}
details.sp>summary i{width:14px;height:14px;border-radius:50%;background:var(--k)}details.sp>summary small{font:500 13px Tajawal;color:#7c8b82;margin-inline-start:auto}
.fl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 14px 14px}
.fl label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:800;color:#a0763f}.fl label.w{grid-column:1/-1}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
@media (max-width:760px){.fl{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:12px}a.c{padding:24px 8px 16px}a.c b{font-size:24px}.i{width:64px;height:64px}}
</style>
</head>
<body>
<header><img src="https://osama-salkhdi.github.io/training/icons/logo.png" alt="" onerror="this.remove()"><h1>مكتب الأولمبياد العلمي السوري بدرعا</h1><p>منصات التدريب · اختر الاختصاص</p></header>
<main><nav class="t"><button id="tb1" class="on">الاختصاصات</button><button id="tb2">🔒 بيانات الاستضافة وكلمات السر</button></nav><div class="grid" id="g"></div><div id="v" hidden></div></main>
<footer>تطوير وإشراف: <b>المهندس أسامة ياسر الصلخدي</b></footer>
<script>
// ===== عدّل هنا فقط: اسم الاختصاص ورابط منصته. اترك الرابط فارغاً '' لاختصاص لم تُنشأ منصته بعد =====
const BASE='https://osama-salkhdi.github.io/';
const SPECS=[
 ['الرياضيات',     BASE+'training2/', '#2d5c4b','math'],
 ['الفيزياء',      BASE+'training/',  '#3f6f8f','phys'],
 ['الكيمياء',      BASE+'training4/', '#8a5a44','chem'],
 ['علم الأحياء',   BASE+'training5/', '#4f7a3a','bio'],
 ['العلوم النووية', BASE+'training3/', '#a0463f','nuc'],
 ['المعلوماتية',   '',                '#6b4b8a','info'],
];
const IC={math:'<path d="M5 6l5 6-5 6"/><path d="M13 8h6M13 16h6M16 5v6"/>',
 phys:'<circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>',
 chem:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/>',
 bio:'<path d="M12 21c-5-2-8-6-8-11 5 0 8 3 8 8 0-5 3-8 8-8 0 5-3 9-8 11z"/><path d="M12 21V9M12 9c0-3 1-5 3-6"/>',
 info:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M9 8l-2 2 2 2M15 8l2 2-2 2"/>',
 nuc:'<circle cx="12" cy="12" r="2.2"/><path d="M12 7a5 5 0 0 1 4.3 2.5L20 7.4A9.3 9.3 0 0 0 12 2.7zM7.7 14.5A5 5 0 0 1 7.7 9.5L4 7.4a9.3 9.3 0 0 0 0 9.2zM16.3 14.5A5 5 0 0 1 12 17v4.3a9.3 9.3 0 0 0 8-4.7z"/>'};
document.getElementById('g').innerHTML=SPECS.map(([n,u,k,i])=>`<a class="c ${u?'':'off'}" ${u?`href="${u}"`:''} style="--k:${k}"><div class="i"><svg viewBox="0 0 24 24">${IC[i]}</svg></div><b>${n}</b><small>${u?'دخول المنصة':'قريباً'}</small></a>`).join('');

/* ====================== خزنة بيانات الاستضافة ======================
   تُشفَّر كل البيانات في المتصفح بكلمة السر الرئيسية (PBKDF2 ‏600 ألف دورة + AES-GCM 256).
   لا يُحفظ ولا يُرسل أي شيء غير مشفّر. كلمة السر الرئيسية لا تُحفظ في أي مكان.
   VAULT: إن لصقت هنا النص المشفّر (من زر «نسخ النص المشفّر») تفتح الخزنة من أي جهاز. */
const VAULT='';
const LS='olymp-vault-v1',ITER=600000,$=id=>document.getElementById(id);
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY=null,SALT=null,DATA=null,TMR=null;
async function mkKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(DATA)));
  return JSON.stringify({v:1,i:ITER,s:b64(SALT),n:b64(iv),c:b64(ct)})}
const stored=()=>{let x=null;try{x=localStorage.getItem(LS)}catch(e){}return x||VAULT||null};
async function persist(){const blob=await seal();try{localStorage.setItem(LS,blob)}catch(e){}return blob}
function lock(){KEY=null;DATA=null;clearTimeout(TMR);drawV()}
function touch(){clearTimeout(TMR);TMR=setTimeout(lock,5*60*1000)}
const FIELDS=[['sbEmail','بريد حساب Supabase','l'],['sbPass','كلمة سر حساب Supabase','p'],['proj','اسم مشروع Supabase','l'],['url','Project URL','l'],['dbPass','كلمة سر قاعدة البيانات (Database Password)','p'],['devPass','كلمة سر حساب dev في المنصة','p'],['repo','مستودع GitHub','l'],['stage','كلمات سر المراحل (1 / 2 / 3)','l'],['note','ملاحظات','w']];
function drawV(){const v=$('v');
  if(!window.crypto||!crypto.subtle){v.innerHTML='<div class="panel lock"><h2>غير متاح</h2><p class="mut">هذا المتصفح لا يدعم التشفير هنا. افتح الصفحة من رابطها على https.</p></div>';return}
  if(!KEY){const has=!!stored();v.innerHTML=`<div class="panel lock"><h2>${has?'افتح الخزنة':'إنشاء خزنة جديدة'}</h2>
    <p class="mut">${has?'أدخل كلمة السر الرئيسية.':'اختر كلمة سر رئيسية قوية (12 حرفاً على الأقل). لا يمكن استرجاعها إن نسيتها.'}</p>
    <form id="lf"><input class="l" type="password" id="pw" placeholder="كلمة السر الرئيسية" autocomplete="off" required>${has?'':'<input class="l" type="password" id="pw2" placeholder="أعد كتابتها" autocomplete="off" required>'}
    <div class="err" id="er"></div><button class="btn">${has?'فتح':'إنشاء'}</button></form>
    ${has?'':'<div class="note">عندك نسخة مشفّرة محفوظة؟ <label class="btn s x" style="display:inline-block">استيراد ملف<input type="file" id="imp" accept=".json,.txt" hidden></label></div>'}
    <div class="note w">البيانات تُشفَّر وتُحفظ في هذا المتصفح فقط. خذ نسخة مشفّرة بعد كل تعديل.</div></div>`;return}
  touch();
  v.innerHTML=`<div class="panel"><div class="vh"><h2>بيانات الاستضافة وكلمات السر</h2><div class="tools"><button class="btn g" data-a="save">حفظ</button><button class="btn s" data-a="exp">تنزيل نسخة مشفّرة</button><button class="btn s" data-a="copy">نسخ النص المشفّر</button><button class="btn s" data-a="chg">تغيير كلمة السر</button><button class="btn bad" data-a="lock">قفل</button></div></div>
   <div class="err" id="er" style="color:#2f7d4f"></div>
   <details class="sp" open><summary><i style="--k:#214539"></i>حسابات عامة</summary><div class="fl">
     ${[['ghEmail','بريد حساب GitHub','l'],['ghPass','كلمة سر GitHub','p'],['gnote','ملاحظات عامة (أرقام، رموز استرجاع…)','w']].map(f=>fld('_g',f)).join('')}</div></details>
   ${SPECS.map(([n,u,k])=>`<details class="sp"><summary><i style="--k:${k}"></i>${n}<small dir="ltr">${esc((DATA[n]||{}).sbEmail||'')}</small></summary><div class="fl">${FIELDS.map(f=>fld(n,f)).join('')}</div></details>`).join('')}
   <p class="mut">تُقفل الخزنة تلقائياً بعد 5 دقائق دون استعمال. اضغط «حفظ» بعد أي تعديل.</p></div>`}
function fld(g,[k,l,t]){const val=esc(((DATA[g]||{})[k])||''),id=`f|${g}|${k}`;
  if(t==='w')return `<label class="w">${l}<textarea rows="2" data-f="${id}">${val}</textarea></label>`;
  return `<label>${l}<span class="row"><input class="l" type="${t==='p'?'password':'text'}" data-f="${id}" value="${val}" autocomplete="off"><button type="button" class="btn s x" data-a="cp">نسخ</button>${t==='p'?'<button type="button" class="btn s x" data-a="eye">إظهار</button>':''}</span></label>`}
function collect(){document.querySelectorAll('[data-f]').forEach(el=>{const [,g,k]=el.dataset.f.split('|');(DATA[g]=DATA[g]||{})[k]=el.value})}
const msg=(t,bad)=>{const e=$('er');if(e){e.textContent=t;e.style.color=bad?'#b0412e':'#2f7d4f'}};
document.addEventListener('submit',async e=>{if(e.target.id!=='lf')return;e.preventDefault();const pw=$('pw').value,blob=stored();
  try{if(blob){const o=JSON.parse(blob);SALT=ub(o.s);const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:o.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
      DATA=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.n)},key,ub(o.c))));
      if(o.i!==ITER){SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await mkKey(pw,SALT);await persist()}else KEY=key}
    else{if(pw.length<12){msg('كلمة السر 12 حرفاً على الأقل',1);return}if(pw!==$('pw2').value){msg('الكلمتان غير متطابقتين',1);return}
      SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await mkKey(pw,SALT);DATA={};await persist()}
    drawV()}catch(er){KEY=null;DATA=null;msg('كلمة السر غير صحيحة',1)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!KEY)return;touch();const a=b.dataset.a;
  if(a==='eye'){const i=b.parentNode.querySelector('input');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'إظهار':'إخفاء';return}
  if(a==='cp'){const i=b.parentNode.querySelector('input');try{await navigator.clipboard.writeText(i.value)}catch(er){i.type='text';i.select()}b.textContent='نُسخ ✓';setTimeout(()=>b.textContent='نسخ',1200);return}
  if(a==='lock'){collect();await persist();lock();return}
  collect();const blob=await persist();
  if(a==='save')msg('حُفظ مشفّراً في هذا المتصفح ✓');
  if(a==='exp'){const u=URL.createObjectURL(new Blob([blob],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download='olympiad-vault-'+new Date().toISOString().slice(0,10)+'.json';x.click();setTimeout(()=>URL.revokeObjectURL(u),2000);msg('نُزّلت النسخة المشفّرة ✓')}
  if(a==='copy'){try{await navigator.clipboard.writeText(blob);msg('نُسخ النص المشفّر ✓')}catch(er){msg('تعذّر النسخ، استعمل «تنزيل نسخة مشفّرة»',1)}}
  if(a==='chg'){const p1=prompt('كلمة السر الرئيسية الجديدة (12 حرفاً على الأقل):');if(p1==null)return;if(p1.length<12){msg('كلمة السر 12 حرفاً على الأقل',1);return}if(prompt('أعد كتابتها:')!==p1){msg('الكلمتان غير متطابقتين',1);return}
    SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await mkKey(p1,SALT);await persist();msg('غُيّرت كلمة السر ✓ خذ نسخة مشفّرة جديدة')}});
document.addEventListener('change',async e=>{if(e.target.id!=='imp'||!e.target.files[0])return;const t=(await e.target.files[0].text()).trim();
  try{const o=JSON.parse(t);if(!o.c||!o.s||!o.n)throw 0;localStorage.setItem(LS,t);drawV()}catch(er){msg('الملف ليس نسخة مشفّرة صالحة',1)}});
['keydown','pointerdown'].forEach(ev=>document.addEventListener(ev,()=>{if(KEY)touch()}));
function tab(n){$('tb1').classList.toggle('on',n===1);$('tb2').classList.toggle('on',n===2);$('g').hidden=n!==1;$('v').hidden=n!==2;if(n===2)drawV();else if(KEY){collect();persist().then(lock)}}
$('tb1').onclick=()=>tab(1);$('tb2').onclick=()=>tab(2);
</script>
</body>
</html>
